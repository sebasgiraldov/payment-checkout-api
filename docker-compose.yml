# Docker Compose configuration for Payment Checkout API
# Includes PostgreSQL database and application service for local development

version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: payment-checkout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
      POSTGRES_DB: payment_checkout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_checkout_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # Payment Checkout API Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: payment-checkout-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      API_VERSION: v1
      DATABASE_URL: postgresql://payment_user:payment_password@postgres:5432/payment_checkout_db?schema=public
      WOMPI_BASE_URL: https://sandbox.wompi.co/v1
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-pub_test_your_public_key_here}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-prv_test_your_private_key_here}
      WOMPI_INTEGRITY_KEY: ${WOMPI_INTEGRITY_KEY:-test_integrity_your_integrity_key_here}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      RATE_LIMIT_PAYMENT_MAX_REQUESTS: 10
      LOG_LEVEL: info
      LOG_FORMAT: json
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - payment-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local

# Network configuration
networks:
  payment-network:
    driver: bridge
